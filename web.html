<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camper Cafe</title>
    <link rel="stylesheet" href="web.css">
</head>
<body>
    <div class="menu">
        <main>
            <h1>Camper Cafe</h1>
            <p><span class="established">Est. 2026</span></p>
            <hr>
            
            <section>
                <h2>Coffee</h2>
                <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg" 
                     alt="Icon representing coffee drinks" 
                     class="menu-image">
                <article class="item">
                    <p class="flavor">French Vanilla</p>
                    <p class="price">3.00$</p>
                </article>
                <article class="item">
                    <p class="flavor">Caramel Macchiato</p>
                    <p class="price">3.75$</p>
                </article>
                <article class="item">
                    <p class="flavor">Pumpkin Spice</p>
                    <p class="price">3.50$</p>
                </article>
                <article class="item">
                    <p class="flavor">Hazelnut</p>
                    <p class="price">4.00$</p>
                </article>
                <article class="item">
                    <p class="flavor">Mocha</p>
                    <p class="price">4.50$</p>
                </article>
            </section>

            <section>
                <h2>Desserts</h2>
                <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg" 
                     alt="Icon representing desserts" 
                     class="menu-image">
                <article class="item">
                    <p class="flavor">Donut</p>
                    <p class="price">1.50$</p>
                </article>
                <article class="item">
                    <p class="flavor">Cherry Pie</p>
                    <p class="price">2.75$</p>
                </article>
                <article class="item">
                    <p class="flavor">Cheesecake</p>
                    <p class="price">3.00$</p>
                </article>
                <article class="item">
                    <p class="flavor">Cinnamon Roll</p>
                    <p class="price">2.50$</p>
                </article>
            </section>
        </main>
        <hr class="bottom-line">
        <footer>
            <p>
                <a href="http://127.0.0.1:3000/web.html?vscode-livepreview=true" target="_blank">Visit our website</a>
            </p>
            <p class="address"> No copyright. All rights Reserved.2026</p>
        </footer>
    </div>
</body>
</html>
